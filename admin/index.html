<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elvin — Правила</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #f4f7fb;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #8e99a8;
      margin-bottom: 32px;
    }

    .card {
      background: #121820;
      border: 1px solid #27313d;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0b1016;
      color: white;
      border: 1px solid #303b48;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: #111;
    }

    .secondary {
      background: #232c37;
      color: white;
    }

    .danger {
      background: #542121;
      color: #ffd8d8;
    }

    .success {
      background: #173d26;
      color: #c8ffd7;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .error {
      background: #4b1f1f;
      color: #ffd4d4;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .rule {
      border: 1px solid #2a3440;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      background: #0e141b;
    }

    .rule-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 15px;
    }

    .rule-title {
      font-size: 18px;
      font-weight: 700;
    }

    .rule-category {
      color: #7f8b99;
      font-size: 13px;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .badge {
      display: inline-block;
      background: #173d26;
      color: #baffca;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div id="loginScreen">
    <div class="card" style="max-width:500px;margin:80px auto;">
      <h1>Elvin Admin</h1>

      <p class="subtitle">
        Керування виробничими правилами
      </p>

      <label>Пароль</label>

      <input
        id="password"
        type="password"
        placeholder="Введіть пароль"
      >

      <div class="buttons">
        <button class="primary" onclick="login()">
          Увійти
        </button>
      </div>

      <div id="loginMessage"></div>
    </div>
  </div>


  <div id="adminScreen" class="hidden">

    <div class="topbar">

      <div>
        <h1>Правила Elvin</h1>

        <div class="subtitle">
          Wardrobe Engine · виробничі правила
        </div>
      </div>

      <button class="secondary" onclick="logout()">
        Вийти
      </button>

    </div>


    <div class="card">

      <h2>Додати правило</h2>

      <div class="grid">

        <div>
          <label>Категорія</label>

          <select id="newCategory">
            <option value="carcass">Корпус</option>
            <option value="material">Матеріал</option>
            <option value="back">Задня стінка</option>
            <option value="plinth">Цоколь</option>
            <option value="facade">Фасади</option>
            <option value="edge">Кромка</option>
            <option value="drilling">Свердління</option>
            <option value="construction">Конструкція</option>
            <option value="general">Загальні</option>
          </select>
        </div>

        <div>
          <label>Назва правила</label>

          <input
            id="newTitle"
            placeholder="Наприклад: Товщина ДСП"
          >
        </div>

      </div>

      <br>

      <label>Правило</label>

      <textarea
        id="newText"
        placeholder="Наприклад: Стандартна товщина корпусного ДСП — 18 мм."
      ></textarea>

      <div class="buttons">

        <button class="primary" onclick="addRule()">
          + Додати правило
        </button>

      </div>

    </div>


    <div class="card">

      <div class="topbar" style="margin-bottom:20px;">

        <div>
          <h2 style="margin:0;">
            Усі правила
          </h2>

          <div
            id="ruleCount"
            class="subtitle"
            style="margin:5px 0 0;"
          ></div>
        </div>

      </div>

      <div id="rules"></div>

    </div>

  </div>

</div>


<script>

let adminPassword = "";
let rules = [];


async function login() {

  const password =
    document.getElementById("password").value.trim();

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if (!password) {

    message.innerHTML =
      '<div class="error">Введіть пароль.</div>';

    return;
  }

  try {

    const response = await fetch(
      "/.netlify/functions/admin-rules",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          action: "login",
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.error || "Неправильний пароль."
      );
    }

    adminPassword = password;

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("adminScreen")
      .classList.remove("hidden");

    await loadRules();

  } catch (error) {

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

  }
}


async function loadRules() {

  const response = await fetch(
    "/.netlify/functions/admin-rules",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        action: "get",
        password: adminPassword
      })
    }
  );

  const data = await response.json();

  if (!response.ok || !data.ok) {
    alert(data.error || "Не вдалося отримати правила.");
    return;
  }

  rules = Array.isArray(data.rules)
    ? data.rules
    : [];

  renderRules();
}


function renderRules() {

  const container =
    document.getElementById("rules");

  document.getElementById("ruleCount").textContent =
    "Правил: " + rules.length;

  if (!rules.length) {

    container.innerHTML =
      '<div class="subtitle">Правил поки немає.</div>';

    return;
  }

  container.innerHTML =
    rules.map((rule, index) => `

      <div class="rule">

        <div class="rule-head">

          <div>

            <div class="rule-title">
              ${escapeHtml(rule.title || "Без назви")}
            </div>

            <div class="rule-category">
              ${escapeHtml(rule.category || "general")}
            </div>

          </div>

          <span class="badge">
            Активне
          </span>

        </div>


        <label>Назва</label>

        <input
          value="${escapeAttribute(rule.title || "")}"
          onchange="updateLocal(${index}, 'title', this.value)"
        >


        <br><br>

        <label>Категорія</label>

        <input
          value="${escapeAttribute(rule.category || "")}"
          onchange="updateLocal(${index}, 'category', this.value)"
        >


        <br><br>

        <label>Правило</label>

        <textarea
          onchange="updateLocal(${index}, 'text', this.value)"
        >${escapeHtml(rule.text || "")}</textarea>


        <div class="buttons">

          <button
            class="primary"
            onclick="saveRules()"
          >
            Зберегти
          </button>

          <button
            class="danger"
            onclick="deleteRule(${index})"
          >
            Видалити
          </button>

        </div>

      </div>

    `).join("");
}


function updateLocal(index, field, value) {

  if (!rules[index]) return;

  rules[index][field] = value;
}


async function addRule() {

  const category =
    document.getElementById("newCategory").value;

  const title =
    document.getElementById("newTitle").value.trim();

  const text =
    document.getElementById("newText").value.trim();

  if (!title || !text) {

    alert(
      "Заповніть назву та текст правила."
    );

    return;
  }

  rules.push({
    id:
      "rule_" +
      Date.now(),

    category,
    title,
    text,
    active: true
  });

  document.getElementById("newTitle").value = "";
  document.getElementById("newText").value = "";

  await saveRules();
}


async function deleteRule(index) {

  if (
    !confirm(
      "Видалити це правило?"
    )
  ) {
    return;
  }

  rules.splice(index, 1);

  await saveRules();
}


async function saveRules() {

  try {

    const response = await fetch(
      "/.netlify/functions/admin-rules",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          action: "save",
          password: adminPassword,
          rules
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Не вдалося зберегти правила."
      );

    }

    rules =
      Array.isArray(data.rules)
        ? data.rules
        : rules;

    renderRules();

    alert("Правила збережено.");

  } catch (error) {

    alert(error.message);

  }
}


function logout() {

  adminPassword = "";
  rules = [];

  document.getElementById("password").value = "";

  document
    .getElementById("adminScreen")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");
}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}


function escapeAttribute(value) {

  return escapeHtml(value)
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
